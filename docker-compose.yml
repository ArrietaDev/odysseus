services:
  odysseus:
    build: .
    expose:
      - "7000"
    volumes:
      - odysseus_data:/app/data
      - odysseus_logs:/app/logs
      - odysseus_ssh:/app/.ssh
      - odysseus_huggingface:/app/.cache/huggingface
      - odysseus_local:/app/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - RESEARCH_LLM_ENDPOINT=${RESEARCH_LLM_ENDPOINT:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=true
      - LOCALHOST_BYPASS=false
      - ODYSSEUS_ADMIN_USER=admin
      - ODYSSEUS_ADMIN_PASSWORD=Nolose2880.-
      - ALLOWED_ORIGINS=https://odin.arrietalabs.com,https://ia.arrietalabs.com
      - SECURE_COOKIES=true
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - FASTEMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - FASTEMBED_CACHE_PATH=/app/data/fastembed_cache
      - CLEANUP_INTERVAL_HOURS=24
      - ODYSSEUS_INPROCESS_POLLERS=1
      - ODYSSEUS_INPROCESS_TASKS=1
      - ODYSSEUS_SCRIPT_HOST=localhost
      - ODYSSEUS_CHAT_UPLOAD_MAX_BYTES=10485760
      - DATA_BRAVE_API_KEY=${DATA_BRAVE_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_PSE_CX=${GOOGLE_PSE_CX:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
      - PUID=1000
      - PGID=1000
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odysseus.rule=Host(`odin.arrietalabs.com`)"
      - "traefik.http.routers.odysseus.entrypoints=websecure"
      - "traefik.http.routers.odysseus.tls.certResolver=letsencrypt"
      - "traefik.http.services.odysseus.loadbalancer.server.port=7000"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - dokploy-network

  chromadb:
    image: docker.io/chromadb/chroma:latest
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - dokploy-network

  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - dokploy-network

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    volumes:
      - ntfy-cache:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=http://ntfy:80
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  odysseus_data:
  odysseus_logs:
  odysseus_ssh:
  odysseus_huggingface:
  odysseus_local:
  searxng-data:
  chromadb-data:
  ntfy-cache:
  ollama_data:

networks:
  dokploy-network:
    external: true
