services:
  odysseus:
    build: .
    expose:
      - "7000"
    volumes:
      - odysseus_data:/app/data
      - odysseus_logs:/app/logs
      - odysseus_ssh:/app/.ssh
      - odysseus_huggingface:/app/.cache/huggingface
      - odysseus_local:/app/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LLM_HOST=${LLM_HOST:-localhost}
      - LLM_HOSTS=${LLM_HOSTS:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/app.db}
      - AUTH_ENABLED=true
      - ODYSSEUS_ADMIN_USER=${ODYSSEUS_ADMIN_USER}
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - SECURE_COOKIES=true
      - FASTEMBED_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - PUID=1000
      - PGID=1000
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odysseus.rule=Host(`odin.arrietalabs.com`)"
      - "traefik.http.routers.odysseus.entrypoints=websecure"
      - "traefik.http.routers.odysseus.tls.certResolver=letsencrypt"
      - "traefik.http.services.odysseus.loadbalancer.server.port=7000"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - dokploy-network

  chromadb:
    image: docker.io/chromadb/chroma:latest
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - dokploy-network

  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)\""]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  odysseus_data:
  odysseus_logs:
  odysseus_ssh:
  odysseus_huggingface:
  odysseus_local:
  searxng-data:
  chromadb-data:
  ollama_data:

networks:
  dokploy-network:
    external: true
